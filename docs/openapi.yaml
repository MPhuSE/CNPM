openapi: 3.0.3
info:
  title: FlowOps authentication API (partial SCRUM-75 contract)
  version: 1.0.0
  description: Only SCRUM-75 authentication endpoints are specified here.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, example: 'http://localhost:5173' }
      description: Exact configured origin; missing or null Origin is rejected.
    Csrf:
      name: X-FlowOps-CSRF
      in: header
      required: true
      schema: { type: string, enum: ['1'] }
    RefreshCookie:
      name: flowops_refresh
      in: cookie
      required: true
      schema: { type: string }
      description: HttpOnly cookie set by login or the previous successful refresh.
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        fullName: { type: string }
        departmentId: { type: string, nullable: true }
        departmentName: { type: string, nullable: true }
        roles: { type: array, items: { type: string } }
    AccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }
  responses:
    BadRequest:
      description: Invalid request body
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Invalid credentials, token, or session
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Origin, CSRF, or authorization denied
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Provisional TBD09 login limit
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
paths:
  /api/v1/auth/login:
    post:
      summary: Login and create a session
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Access token and user; refresh secret is only in Set-Cookie, never JSON
          headers:
            Set-Cookie: { schema: { type: string }, description: 'flowops_refresh; HttpOnly; SameSite=Lax; Path=/api/v1/auth; host-only; Secure in production' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AccessToken' }
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh secret and issue a new access token
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/RefreshCookie' }]
      responses:
        '200':
          description: New access token and rotated flowops_refresh cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AccessToken' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/logout:
    post:
      summary: Revoke only the Bearer token's sid and clear refresh cookie
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: Session revoked; Set-Cookie clears flowops_refresh }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/password:
    post:
      summary: Change password and revoke all sessions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, description: '15+ Unicode code points and at most 72 UTF-8 bytes' }
      responses:
        '204': { description: All sessions revoked; Set-Cookie clears flowops_refresh }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
