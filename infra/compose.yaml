services:
  postgres:
    image: postgres:16-alpine
    container_name: flowops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowopspassword
    ports:
      - "5432:5432"
    volumes:
      - flowops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flowops_pgdata:
    driver: local
