server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: flowops-server
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowops}
    username: ${SPRING_DATASOURCE_USERNAME:flowops}
    password: ${SPRING_DATASOURCE_PASSWORD:flowops}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

flowops:
  jwt:
    secret: ${FLOWOPS_JWT_SECRET}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${FLOWOPS_CORS_ORIGINS}
  auth:
    bcrypt-strength: ${FLOWOPS_BCRYPT_STRENGTH:12}
    cookie:
      secure: ${FLOWOPS_COOKIE_SECURE:true}
    rate-limit:
      account-failures: ${FLOWOPS_LOGIN_ACCOUNT_LIMIT:5}
      ip-attempts: ${FLOWOPS_LOGIN_IP_LIMIT:30}
      window-seconds: ${FLOWOPS_LOGIN_WINDOW_SECONDS:900}
      max-entries: ${FLOWOPS_LOGIN_MAX_ENTRIES:10000}
  scheduler:
    sla-check-enabled: true
    cron: "0 * * * * *" # Every minute

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
